<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد منتصر - الهكر</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            background-image: linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .profile-container {
            border: 2px solid #00ff41;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.6), inset 0 0 15px rgba(0, 255, 65, 0.2);
            background-color: rgba(0, 15, 0, 0.85);
            max-width: 450px;
            width: 90%;
            position: relative;
        }
        .top-bar {
            font-size: 0.9em;
            color: #00bfff;
            text-align: left;
            margin-bottom: 20px;
            border-bottom: 1px dashed #00ff41;
            padding-bottom: 10px;
        }
        .profile-img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 4px solid #00ff41;
            object-fit: cover;
            box-shadow: 0 0 20px #00ff41;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.2em;
            margin: 10px 0;
            text-shadow: 0 0 15px #00ff41;
        }
        .role {
            font-size: 1.4em;
            color: #00bfff;
            margin-top: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00bfff;
        }
        .contact-info {
            margin-top: 20px;
            font-size: 1.1em;
            color: #c9d1d9;
            background-color: rgba(0, 255, 65, 0.1);
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }
        .contact-info a {
            color: #00ff41;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 0 0 8px #00ff41;
        }
        .contact-info a:hover {
            text-shadow: 0 0 15px #00ff41, 0 0 25px #00ff41;
        }
        .developer {
            margin-top: 30px;
            font-size: 1.1em;
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            border-top: 1px dashed #00ff41;
            padding-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="top-bar">root@ALnkbot:~# ./run_profile</div>
        
        <!-- الصورة مرفوعة على الإنترنت -->
        <img src="https://i.postimg.cc/SQPp0X49/Screenshot-20261016-112045.jpg" alt="صورة محمد منتصر" class="profile-img">
        
        <h1>محمد منتصر</h1>
        <div class="role">الهكر</div>
        
        <div class="contact-info">
            📞 للتواصل: <a href="tel:01149320675">01149320675</a>
        </div>
        
        <div class="developer">المطور: ALnkbot الهكر</div>
    </div>

</body>
</html>
